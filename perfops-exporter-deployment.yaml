# perfops-exporter.yaml
# --- PERSISTENT VOLUME CLAIM ---                                    # NEW
# Stores the geocoding cache (geo_cache.json) across pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: perfops-exporter-data
  labels:
    app: perfops-exporter
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: standard   # uncomment/set if your cluster has no default StorageClass
  resources:
    requests:
      storage: 100Mi              # the cache is only KBs; this is plenty
---
# --- DEPLOYMENT ---
# Manages the lifecycle of the perfops-exporter pod. 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfops-exporter
  labels:
    app: perfops-exporter
spec:  # Ensures one replica of the pod is always running. 
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: perfops-exporter  # Blueprint for the pods created by this Deployment. 
  template:
    metadata:
      labels:
        app: perfops-exporter
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: perfops-exporter-container
        # IMPORTANT: Replace with your actual image path from your registry.
        image: your-repo/perfops-exporter:latest
        imagePullPolicy: Always
        # Securely inject the API keys and configurations from a Kubernetes Secret/ConfigMap. 
        env:
        - name: PERFOPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: perfops-secret
              key: PERFOPS_API_KEY
        - name: INFLUXDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: perfops-secret
              key: INFLUXDB_TOKEN
        - name: INFLUXDB_URL
          value: "http://influxdb.monitoring.svc.cluster.local:8086"
        - name: INFLUXDB_ORG
          value: "perfops"
        - name: INFLUXDB_BUCKET
          value: "perfops-cdn"
        - name: SCRAPE_INTERVAL
          value: "120"
        - name: CHECKPOINT_FILE
          value: "/data/checkpoint.json"
        - name: MAX_BACKFILL_HOURS
          value: "48"
        - name: RETENTION_SAFETY_MINUTES
          value: "5"
        - name: BACKFILL_CHUNK_MINUTES
          value: "10"
        - name: OVERLAP_SECONDS
          value: "60"
        - name: INGEST_LAG_SECONDS
          value: "0"
        - name: BACKFILL_REQUEST_DELAY
          value: "0.5"
        - name: MAX_PAGES_PER_WINDOW
          value: "500"
        - name: GEO_CACHE_FILE
          value: "/data/geo_cache.json"
        - name: GEOCODER_USER_AGENT
          value: "perfops-exporter (your-team@yourcompany.com)"
        - name: PYTHONUNBUFFERED
          value: "1"
        # NEW: mount the PVC
        volumeMounts:
          - name: exporter-data
            mountPath: /data
      # NEW: link the PVC to the pod
      volumes:
        - name: exporter-data
          persistentVolumeClaim:
            claimName: perfops-exporter-data