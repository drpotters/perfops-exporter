# perfops-exporter.yaml
# --- DEPLOYMENT ---
# Manages the lifecycle of the perfops-exporter pod. 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfops-exporter
  labels:
    app: perfops-exporter
spec:  # Ensures one replica of the pod is always running. 
  replicas: 1  # Links the Deployment to the pods it manages via labels. 
  selector:
    matchLabels:
      app: perfops-exporter  # Blueprint for the pods created by this Deployment. 
  template:
    metadata:
      labels:
        app: perfops-exporter
    spec:
      containers:
      - name: perfops-exporter-container
        # IMPORTANT: Replace with your actual image path from your registry.
        image: your-repo/perfops-exporter:latest
        imagePullPolicy: Always
        # Securely inject the API keys and configurations from a Kubernetes Secret/ConfigMap. 
        env:
        - name: PERFOPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: perfops-secret
              key: PERFOPS_API_KEY
        - name: INFLUXDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: perfops-secret
              key: INFLUXDB_TOKEN
        - name: INFLUXDB_URL
          value: "http://influxdb.monitoring.svc.cluster.local:8086"
        - name: INFLUXDB_ORG
          value: "perfops"
        - name: INFLUXDB_BUCKET
          value: "perfops_cdn"
        - name: SCRAPE_INTERVAL
          value: "120"
